<!DOCTYPE html>
<html>
<head><title>RewordAI Icon Generator</title></head>
<body style="font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 20px;">
    <h2>RewordAI Icon Generator</h2>
    <p>Click the button below to generate and download all required PNG icons.</p>
    <button id="generate" style="padding: 12px 24px; font-size: 16px; cursor: pointer; background: #6366f1; color: white; border: none; border-radius: 8px;">
        Generate & Download Icons
    </button>
    <div id="preview" style="margin-top: 20px; display: flex; gap: 16px; align-items: end;"></div>

    <script>
        const sizes = [16, 32, 48, 128];

        function drawIcon(ctx, size) {
            const s = size / 128;

            // Background gradient
            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#6366f1');
            grad.addColorStop(1, '#7c3aed');
            ctx.fillStyle = grad;

            // Rounded rect
            const r = 24 * s;
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(size - r, 0);
            ctx.quadraticCurveTo(size, 0, size, r);
            ctx.lineTo(size, size - r);
            ctx.quadraticCurveTo(size, size, size - r, size);
            ctx.lineTo(r, size);
            ctx.quadraticCurveTo(0, size, 0, size - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fill();

            // Text lines
            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.lineCap = 'round';
            ctx.lineWidth = Math.max(2, 6 * s);
            const lx = 28 * s, rx = 100 * s;
            ctx.beginPath(); ctx.moveTo(lx, 40 * s); ctx.lineTo(rx, 40 * s); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(lx, 58 * s); ctx.lineTo(78 * s, 58 * s); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(lx, 76 * s); ctx.lineTo(88 * s, 76 * s); ctx.stroke();

            // Check circle
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(92 * s, 82 * s, 18 * s, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'white';
            ctx.lineWidth = Math.max(1.5, 4 * s);
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(83 * s, 82 * s);
            ctx.lineTo(89 * s, 88 * s);
            ctx.lineTo(101 * s, 76 * s);
            ctx.stroke();
        }

        document.getElementById('generate').addEventListener('click', () => {
            const preview = document.getElementById('preview');
            preview.innerHTML = '';

            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                drawIcon(ctx, size);

                // Show preview
                const wrapper = document.createElement('div');
                wrapper.style.textAlign = 'center';
                wrapper.appendChild(canvas);
                const label = document.createElement('div');
                label.textContent = `${size}x${size}`;
                label.style.fontSize = '12px';
                label.style.color = '#666';
                label.style.marginTop = '4px';
                wrapper.appendChild(label);
                preview.appendChild(wrapper);

                // Download
                const link = document.createElement('a');
                link.download = `icon${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
