<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RewordAI - Local Test</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1b4b;
            font-family: system-ui, sans-serif;
            margin: 0;
        }
        .test-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .test-banner {
            background: rgba(255,255,255,0.1);
            color: #c7d2fe;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            max-width: 420px;
        }
        .test-banner strong { color: #fbbf24; }
        .popup-frame {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="test-wrapper">
        <div class="test-banner">
            <strong>Local Test Mode</strong> — Chrome APIs are mocked using localStorage.
            Enter your OpenAI key in Settings to test real API calls.
        </div>
        <div class="popup-frame">
            <div class="container">
                <header>
                    <div class="header-row">
                        <div class="logo">
                            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                                <rect width="28" height="28" rx="8" fill="rgba(255,255,255,0.2)"/>
                                <path d="M8 10h12M8 14h8M8 18h10" stroke="white" stroke-width="2" stroke-linecap="round"/>
                                <circle cx="21" cy="18" r="4" fill="#fbbf24" opacity="0.9"/>
                                <path d="M19.5 18l1 1 2-2" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <div>
                                <h1>RewordAI</h1>
                                <p class="tagline">AI-powered text enhancement</p>
                            </div>
                        </div>
                        <button id="settingsToggle" class="icon-btn" title="Settings">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                            </svg>
                        </button>
                    </div>
                </header>

                <div id="settingsPanel" class="settings-panel hidden">
                    <div class="settings-content">
                        <h3>Settings</h3>
                        <div class="setting-group">
                            <label for="apiKeyInput">OpenAI API Key</label>
                            <div class="api-key-wrapper">
                                <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
                                <button id="toggleKeyVisibility" class="icon-btn small" title="Show/Hide">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                            </div>
                            <span class="hint">Get your key from <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com</a></span>
                        </div>
                        <div class="setting-group">
                            <label for="modelSelect">Model</label>
                            <select id="modelSelect">
                                <option value="gpt-4o-mini">GPT-4o Mini (Fast & Cheap)</option>
                                <option value="gpt-4o">GPT-4o (Best Quality)</option>
                                <option value="gpt-4.1-mini">GPT-4.1 Mini</option>
                            </select>
                        </div>
                        <div class="setting-actions">
                            <button id="saveSettingsBtn" class="btn btn-primary btn-sm">Save Settings</button>
                            <span id="settingsStatus" class="settings-status"></span>
                        </div>
                    </div>
                </div>

                <main>
                    <div class="input-section">
                        <div class="section-header">
                            <label for="textInput">Input Text</label>
                            <span id="charCount" class="char-count">0 chars</span>
                        </div>
                        <textarea id="textInput" placeholder="Paste or type your text here..." rows="5"></textarea>
                    </div>

                    <div class="controls">
                        <div class="style-selector">
                            <select id="styleSelect">
                                <option value="professional">Professional</option>
                                <option value="casual">Casual</option>
                                <option value="creative">Creative</option>
                                <option value="formal">Formal</option>
                                <option value="academic">Academic</option>
                                <option value="simplified">Simplified</option>
                                <option value="persuasive">Persuasive</option>
                                <option value="friendly">Friendly</option>
                            </select>
                        </div>
                        <button id="rewordBtn" class="btn btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="17 1 21 5 17 9"/>
                                <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                                <polyline points="7 23 3 19 7 15"/>
                                <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                            </svg>
                            <span>Reword</span>
                        </button>
                    </div>

                    <div class="output-section">
                        <div class="section-header">
                            <label for="textOutput">Result</label>
                            <div class="output-actions">
                                <button id="copyBtn" class="icon-btn small" disabled title="Copy to clipboard">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                    </svg>
                                </button>
                                <button id="clearBtn" class="icon-btn small" title="Clear all">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6"/>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <textarea id="textOutput" readonly placeholder="Enhanced text will appear here..."></textarea>
                    </div>
                </main>

                <footer>
                    <div id="status" class="status"></div>
                    <div class="shortcuts-hint">
                        <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> Reword</span>
                    </div>
                </footer>
            </div>
        </div>
    </div>

    <script>
        // Mock the chrome.* APIs used by background.js and popup.js (storage backed by localStorage)
        const storageData = JSON.parse(localStorage.getItem('rewordai') || '{}');
        const persist = () => localStorage.setItem('rewordai', JSON.stringify(storageData));
        const done = (cb, value) => { if (cb) cb(value); return Promise.resolve(value); };
        const noopEvent = { addListener() {} };
        const messageListeners = [];
        window.chrome = {
            storage: {
                local: {
                    get(keys, cb) {
                        const result = {};
                        (Array.isArray(keys) ? keys : [keys]).forEach(k => {
                            if (storageData[k] !== undefined) result[k] = storageData[k];
                        });
                        return done(cb, result);
                    },
                    set(obj, cb) {
                        Object.assign(storageData, obj);
                        persist();
                        return done(cb);
                    },
                    remove(keys, cb) {
                        (Array.isArray(keys) ? keys : [keys]).forEach(k => delete storageData[k]);
                        persist();
                        return done(cb);
                    }
                }
            },
            runtime: {
                onInstalled: noopEvent,
                onMessage: { addListener(fn) { messageListeners.push(fn); } },
                sendMessage(msg) {
                    return new Promise(resolve => messageListeners.forEach(fn => fn(msg, {}, resolve)));
                }
            },
            contextMenus: { onClicked: noopEvent },
            commands: { onCommand: noopEvent }
        };
    </script>
    <script src="background.js"></script>
    <script src="popup.js"></script>
</body>
</html>
